<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Entry Test Result Portal{% endblock %} — CUVAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <img class="brand-logo" src="{{ url_for('static', filename='img/cuvas-logo-header.png') }}" alt="CUVAS logo">
        <div>
          <div class="uni">{{ uni }}</div>
          <div class="sub">{{ title }}</div>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap container">
    {% with msgs = get_flashed_messages() %}
      {% if msgs %}<div class="flash">{% for m in msgs %}<p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>{{ m }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-foot">
    <div class="wrap">&copy; 2026 Cholistan University of Veterinary &amp; Animal Sciences, Bahawalpur</div>
  </footer>
</body>
</html>
