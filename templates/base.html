<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Entry Test Result Portal{% endblock %} — CUVAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=19">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <img class="brand-logo" src="{{ url_for('static', filename='img/cuvas-logo-header.png') }}" alt="CUVAS logo">
        <div>
          <div class="uni">{{ uni }}</div>
          <div class="sub">{{ title }}</div>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap container">
    {% with msgs = get_flashed_messages() %}
      {% if msgs %}<div class="flash">{% for m in msgs %}<p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>{{ m }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-foot">
    <div class="wrap">&copy; 2026 Cholistan University of Veterinary &amp; Animal Sciences, Bahawalpur</div>
  </footer>
  <div class="dl-toast" id="dlToast" role="status" aria-live="polite"></div>
  <script>
  (function () {
    /* Force-download for PDF buttons: some browsers/webviews ignore the
       server's attachment header and just display the PDF. Fetching the
       file as a blob and clicking a temporary download link saves it
       properly almost everywhere, and the toast confirms it happened. */
    var toast = document.getElementById('dlToast'), timer = null;
    function showToast(msg, sticky) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (timer) clearTimeout(timer);
      if (!sticky) timer = setTimeout(function () { toast.classList.remove('show'); }, 4500);
    }
    function hideToast() { toast.classList.remove('show'); }
    document.addEventListener('click', function (ev) {
      var a = ev.target.closest ? ev.target.closest('a[data-download]') : null;
      if (!a) return;
      ev.preventDefault();
      var url = a.getAttribute('href');
      showToast('Downloading your PDF…', true);
      /* Try the blob route first (fixes browsers that display PDFs
         inline), but never get stuck on it: if the fetch/blob has not
         finished within 3 seconds, fall back to the classic download
         navigation, which the server's attachment header handles. */
      var ctrl = ('AbortController' in window) ? new AbortController() : null;
      var killer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 3000);
      fetch(url, { credentials: 'same-origin',
                   signal: ctrl ? ctrl.signal : undefined }).then(function (resp) {
        if (!resp.ok) throw new Error('bad response');
        var name = 'CUVAS_Result_Card.pdf';
        var cd = resp.headers.get('Content-Disposition') || '';
        var m = cd.match(/filename="?([^";]+)"?/i);
        if (m) name = m[1];
        return resp.blob().then(function (blob) { return { blob: blob, name: name }; });
      }).then(function (out) {
        clearTimeout(killer);
        var objUrl = URL.createObjectURL(out.blob);
        var tmp = document.createElement('a');
        tmp.href = objUrl;
        tmp.download = out.name;
        document.body.appendChild(tmp);
        tmp.click();
        tmp.remove();
        setTimeout(function () { URL.revokeObjectURL(objUrl); }, 4000);
        showToast('Downloaded ✓ — please check your Downloads folder.');
      }).catch(function () {
        clearTimeout(killer);
        showToast('Download started — please check your Downloads folder.');
        window.location.assign(url);
      });
    });
    window.addEventListener('pageshow', hideToast);
  })();
  </script>
</body>
</html>
